name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fixar versão do npm
        run: npm install --global npm@11.6.2

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código
        run: npm run lint

      - name: Executar testes frontend
        run: npm test

      - name: Gerar aplicação
        run: npm run build

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar política de dados
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\0")
          violations = []
          local_layers = ("data/raw/", "data/silver/", "data/gold/")
          placeholders = {f"{layer}.gitkeep" for layer in local_layers}

          for name in filter(None, tracked):
              if name.startswith(local_layers) and name not in placeholders:
                  violations.append(f"artefato local rastreado: {name}")
              if name.endswith(".parquet"):
                  violations.append(f"Parquet rastreado: {name}")
              if name.startswith("data/manifests/"):
                  path = Path(name)
                  if path.suffix != ".json":
                      violations.append(f"manifest não JSON rastreado: {name}")
                  elif path.stat().st_size > 1_000_000:
                      violations.append(f"manifest maior que 1 MB: {name}")

          if violations:
              raise SystemExit("\n".join(violations))
          PY

      - name: Validar dados de apresentacao versionados
        run: python scripts/validate_frontend_data.py

      - name: Executar testes Python
        run: python -m pytest -q
